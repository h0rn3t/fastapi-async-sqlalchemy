[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-async-sqlalchemy"
dynamic = ["version"]
description = "SQLAlchemy middleware for FastAPI"
readme = "README.md"
license = "MIT"
authors = [{ name = "Eugene Shershen", email = "h0rn3t.null@gmail.com" }]
requires-python = ">=3.12"
# `SQLAlchemy[asyncio]` rather than plain `SQLAlchemy`: the asyncio extra is what
# guarantees greenlet, which SQLAlchemy 2.0 does not install on every platform.
dependencies = ["starlette>=0.40", "SQLAlchemy[asyncio]>=2.0"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Code = "https://github.com/h0rn3t/fastapi-async-sqlalchemy"
"Issue tracker" = "https://github.com/h0rn3t/fastapi-async-sqlalchemy/issues"

[tool.setuptools]
packages = ["fastapi_async_sqlalchemy"]

[tool.setuptools.package-data]
fastapi_async_sqlalchemy = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "fastapi_async_sqlalchemy.__version__" }

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E203", # whitespace before ':'
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
combine-as-imports = true
split-on-trailing-comma = true

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
]
