name: ci
on:
  pull_request:
    branches:
    - main
  push:
    branches:
    - main

jobs:
  test:
    name: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        build: [linux_3.12, windows_3.12, mac_3.12, linux_3.13, linux_3.14, linux_3.15]
        include:
        - build: linux_3.12
          os: ubuntu-latest
          python: '3.12'
          allow-prereleases: false
        - build: linux_3.13
          os: ubuntu-latest
          python: '3.13'
          allow-prereleases: false
        - build: linux_3.14
          os: ubuntu-latest
          python: '3.14'
          allow-prereleases: false
        - build: linux_3.15
          os: ubuntu-latest
          python: '3.15'
          allow-prereleases: true
        - build: windows_3.12
          os: windows-latest
          python: '3.12'
          allow-prereleases: false
        - build: mac_3.12
          os: macos-latest
          python: '3.12'
          allow-prereleases: false
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
        allow-prereleases: ${{ matrix.allow-prereleases }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip wheel
        pip install -r requirements.txt

    # test all the builds apart from linux_3.12...
    - name: Test with pytest
      if: matrix.build != 'linux_3.12'
      run: pytest

    # only do the test coverage for linux_3.12
    - name: Produce coverage report
      if: matrix.build == 'linux_3.12'
      run: pytest --cov=fastapi_async_sqlalchemy --cov-report=xml

    - name: Upload coverage report
      if: matrix.build == 'linux_3.12'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}

  test-postgres:
    name: test-postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
        - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip wheel
        pip install -r requirements.txt

    - name: Run PostgreSQL concurrent-queries tests
      env:
        POSTGRES_TEST_URL: postgresql+asyncpg://test:test@localhost:5432/test
      run: pytest tests/test_concurrent_queries_postgres.py -v

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.12

    - name: Install dependencies
      run: pip install ruff

    - name: Run ruff linter
      run: ruff check .

    - name: Run ruff formatter
      run: ruff format --check .
